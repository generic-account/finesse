[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finesse-fsm"
version = "0.1.0"
description = "A small FSM toolkit for simulation and hardware generation"
requires-python = ">=3.10"

[project.optional-dependencies]
viewer = ["matplotlib>=3.8", "PySide6-Essentials>=6.6"]

[tool.setuptools.packages.find]
include = ["finesse*"]
